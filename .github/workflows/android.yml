name: Android verification

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
      - name: Test, lint, and assemble
        run: ./gradlew --no-daemon test lintDebug assembleDebug assembleRelease

      - name: Generate artifact checksums
        run: python3 scripts/release_manifest.py
      - name: Retain build and verification artifacts
        uses: actions/upload-artifact@v4
        with:
          name: hub-helper-verification
          path: |
            app/build/outputs/apk/
            app/build/reports/
            core/domain/build/reports/
            core/data/build/reports/
            build/release-manifest.json
